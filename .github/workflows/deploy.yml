name: deploy

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.167.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check generated files are up to date
        run: |
          python3 site/build.py
          git diff --exit-code -- layouts static || {
            echo "::error::Generated files are stale. Run 'python3 site/build.py' and commit the result."
            exit 1
          }

      - name: Install Hugo
        run: |
          cd "$RUNNER_TEMP"
          base="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}"
          tarball="hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/hugo_${HUGO_VERSION}_checksums.txt"
          grep " ${tarball}\$" "hugo_${HUGO_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" hugo
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Build
        run: hugo --minify

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    env:
      AWS_REGION: us-east-1
      ROLE_ARN: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
      BUCKET: ${{ vars.SITE_BUCKET }}
      DISTRIBUTION_ID: ${{ vars.CF_DISTRIBUTION_ID }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: Assume the deploy role with GitHub OIDC
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r .value)
          creds=$(aws sts assume-role-with-web-identity \
            --role-arn "$ROLE_ARN" \
            --role-session-name "gh-${GITHUB_RUN_ID}" \
            --web-identity-token "$token" \
            --duration-seconds 900 \
            --query Credentials --output json)
          for pair in AWS_ACCESS_KEY_ID:AccessKeyId AWS_SECRET_ACCESS_KEY:SecretAccessKey AWS_SESSION_TOKEN:SessionToken; do
            value=$(jq -r ".${pair#*:}" <<<"$creds")
            echo "::add-mask::$value"
            echo "${pair%%:*}=$value" >> "$GITHUB_ENV"
          done

      - name: Upload to S3
        run: |
          # Pages and text change often; photos rarely.
          aws s3 sync public/ "s3://$BUCKET" --delete --exclude "img/*" \
            --cache-control "public, max-age=300"
          aws s3 sync public/img "s3://$BUCKET/img" --delete \
            --cache-control "public, max-age=604800"
          aws s3 cp public/index.md "s3://$BUCKET/index.md" \
            --content-type "text/markdown; charset=utf-8" --cache-control "public, max-age=300"
          aws s3 cp public/llms.txt "s3://$BUCKET/llms.txt" \
            --content-type "text/plain; charset=utf-8" --cache-control "public, max-age=300"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*" \
            --query Invalidation.Id --output text
